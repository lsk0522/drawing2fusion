name: unit tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install reader dependencies
        run: python -m pip install ezdxf pymupdf pillow
      - name: Unit tests (no Fusion needed)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set +e
          python -m unittest discover -s tests -t . -v > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ $code -ne 0 ]; then
            # failures as annotations, readable without downloading logs
            python - <<'PY'
          import re
          text = open("test-output.txt", encoding="utf-8", errors="replace").read()
          for block in re.split(r"\n=+\n", text)[1:]:
              msg = block.strip()[:1800].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=unittest::" + msg)
          PY
          fi
          exit $code
